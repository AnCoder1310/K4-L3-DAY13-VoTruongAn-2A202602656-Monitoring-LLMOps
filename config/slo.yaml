service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Dựa trên baseline thực tế: thời gian phản hồi bình thường ~160ms (TTFT ~55ms), không có lỗi. Ngưỡng SLO latency <= 3000ms là hợp lý để bảo đảm trải nghiệm người dùng. Với mục tiêu 99.5% trong cửa sổ 28 ngày (10,000 requests), error budget cho phép là 0.5% tương đương tối đa 50 requests bị lỗi hoặc vượt quá 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
